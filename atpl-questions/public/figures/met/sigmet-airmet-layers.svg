<svg width="980" height="520" viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg">
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="490" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">SIGMET vs AIRMET</text>
  <text x="490" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Hazard information issued by the Meteorological Watch Office</text>

  <line x1="120" y1="400" x2="860" y2="400" stroke="#94a3b8" stroke-width="3"/>
  <text x="105" y="405" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#334155">surface</text>

  <line x1="120" y1="235" x2="860" y2="235" stroke="#f59e0b" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="105" y="240" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#f59e0b">FL100</text>

  <line x1="120" y1="185" x2="860" y2="185" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="105" y="190" text-anchor="end" font-family="Arial, sans-serif" font-size="15" fill="#f59e0b">FL150 mountainous</text>

  <rect x="175" y="260" width="270" height="105" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <text x="310" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#92400e">AIRMET</text>
  <text x="310" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">low-level hazards</text>
  <text x="310" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">normally below FL100/FL150</text>

  <rect x="535" y="105" width="270" height="125" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
  <text x="670" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#991b1b">SIGMET</text>
  <text x="670" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">en-route significant weather</text>
  <text x="670" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">affecting safety of aircraft</text>

  <path d="M620 290 C640 250, 700 250, 720 290 C755 292, 775 335, 740 350 L605 350 C560 348, 575 295, 620 290Z" fill="#e2e8f0" stroke="#111827" stroke-width="4"/>
  <path d="M675 350 L650 400 L690 368 L666 430" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <text x="675" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">TS / CB / severe turbulence / icing / VA / TC</text>
