  <text x="735" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ef4444">outflow</text>
  <text x="500" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0ea5e9">downdraft</text>

  <text x="490" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">Typical sequence on approach: headwind gain → downdraft → tailwind loss.</text>
