<svg width="980" height="520" viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg">
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="490" y="44" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#111827">Aircraft Observation Reporting Flow</text>

  <rect x="70" y="160" width="210" height="115" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="175" y="205" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#111827">Aircraft</text>
  <text x="175" y="235" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">special observation</text>

  <rect x="385" y="160" width="210" height="115" rx="20" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
  <text x="490" y="205" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0e7490">ATS unit</text>
  <text x="490" y="235" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">relay / coordinate</text>

  <rect x="700" y="160" width="210" height="115" rx="20" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <text x="805" y="205" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#92400e">MWO</text>
  <text x="805" y="235" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">SIGMET / AIRMET</text>

  <line x1="280" y1="217" x2="385" y2="217" stroke="#111827" stroke-width="4"/>
  <polygon points="385,217 365,205 365,229" fill="#111827"/>
  <line x1="595" y1="217" x2="700" y2="217" stroke="#111827" stroke-width="4"/>
  <polygon points="700,217 680,205 680,229" fill="#111827"/>

  <rect x="185" y="355" width="610" height="80" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
  <text x="490" y="388" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#991b1b">Examples: severe turbulence • moderate/severe icing • severe mountain wave • volcanic ash</text>
  <text x="490" y="415" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">Pilot reports can trigger or update hazard information for other aircraft.</text>
</svg>
