<svg width="980" height="520" viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg">
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="490" y="44" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#111827">VOLMET vs ATIS</text>
  <text x="490" y="75" text-anchor="middle" font-family="Arial" font-size="15" fill="#64748b">Broadcast meteorological information for aircraft</text>

  <rect x="110" y="140" width="300" height="210" rx="24" fill="#ecfeff" stroke="#06b6d4" stroke-width="4"/>
  <text x="260" y="185" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0e7490">VOLMET</text>
  <path d="M205 245 C245 205, 285 205, 325 245" fill="none" stroke="#0ea5e9" stroke-width="8"/>
  <path d="M180 275 C240 220, 290 220, 345 275" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-dasharray="10 8"/>
  <text x="260" y="315" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155">METAR / SPECI / SIGMET</text>
  <text x="260" y="340" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155">broadcast to aircraft in flight</text>

  <rect x="570" y="140" width="300" height="210" rx="24" fill="#fffbeb" stroke="#f59e0b" stroke-width="4"/>
  <text x="720" y="185" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#92400e">ATIS</text>
  <rect x="650" y="230" width="140" height="70" rx="12" fill="#111827"/>
  <text x="720" y="275" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#ffffff">INFO B</text>
  <text x="720" y="335" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155">terminal information</text>

  <text x="490" y="445" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">VOLMET supports en-route awareness. ATIS supports arrival/departure terminal setup.</text>
